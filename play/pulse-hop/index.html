<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulse Hop</title>
<style>html,body{margin:0;height:100%;background:#0b0b18;overflow:hidden;font-family:system-ui;color:#fff;touch-action:manipulation}canvas{display:block;margin:auto}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H;function rs(){W=c.width=Math.min(innerWidth,500);H=c.height=innerHeight}rs();onresize=rs;
// Pulse Hop: an orb orbits a ring. Press to jump to the next ring when the gap lines up.
let st='start',rings,cur,ang,spd,score,best=+localStorage.pb||0,parts,shake,combo;
function reset(){rings=[];for(let i=0;i<6;i++)addRing();cur=0;ang=0;spd=1.6;score=0;parts=[];shake=0;combo=0}
function addRing(){const n=rings.length;rings.push({gap:Math.random()*Math.PI*2,size:0.9-Math.min(n*0.02,0.5),dir:Math.random()<.5?1:-1,rot:0,rs:(0.3+Math.min(n*0.06,1.4))*(Math.random()<.5?1:-1)})}
function radius(i){return 60+(i-cur)*55}
function press(){if(st!=='play'){reset();st='play';return}
 const r=rings[cur+1];let d=((ang-(r.gap+r.rot))%(Math.PI*2)+Math.PI*3)%(Math.PI*2)-Math.PI;
 if(Math.abs(d)<r.size/2){const perfect=Math.abs(d)<r.size/6;combo=perfect?combo+1:0;score+=1+combo;cur++;addRing();spd=Math.min(spd+0.08,4.5);boom(perfect?'#ffd84d':'#5cf2ff',perfect?30:14)}
 else{st='over';shake=15;boom('#ff4d6d',40);if(score>best){best=score;localStorage.pb=best}}}
function boom(col,n){const R=radius(cur);for(let i=0;i<n;i++)parts.push({x:Math.cos(ang)*R,y:Math.sin(ang)*R,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,l:1,col})}
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!e.repeat)press()}});c.addEventListener('pointerdown',e=>{e.preventDefault();press()});
let last=performance.now();function loop(t){const dt=Math.min((t-last)/1000,.05);last=t;
 if(st==='play'){ang+=spd*dt*rings[cur].dir;rings.forEach(r=>r.rot+=r.rs*dt)}
 x.fillStyle='rgba(11,11,24,.35)';x.fillRect(0,0,W,H);x.save();x.translate(W/2+(Math.random()-.5)*shake,H/2+(Math.random()-.5)*shake);shake*=.9;
 if(rings){for(let i=cur;i<rings.length;i++){const R=radius(i),r=rings[i];if(R>Math.max(W,H))break;x.lineWidth=6;x.strokeStyle=i===cur?'#7a5cff':i===cur+1?'#5cf2ff':'#2a2a4a';x.beginPath();
  if(i===cur)x.arc(0,0,R,0,Math.PI*2);else{const g=r.gap+r.rot;x.arc(0,0,R,g+r.size/2,g-r.size/2+Math.PI*2)}x.stroke()}
  if(st!=='start'){const R=radius(cur);x.fillStyle='#fff';x.shadowColor='#5cf2ff';x.shadowBlur=20;x.beginPath();x.arc(Math.cos(ang)*R,Math.sin(ang)*R,9,0,7);x.fill();x.shadowBlur=0}
  parts=parts.filter(p=>(p.l-=dt*1.5)>0);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;x.globalAlpha=p.l;x.fillStyle=p.col;x.fillRect(p.x,p.y,4,4)});x.globalAlpha=1}
 x.restore();x.textAlign='center';x.fillStyle='#fff';
 if(st==='play'){x.font='bold 40px system-ui';x.fillText(score,W/2,60);if(combo>0){x.font='16px system-ui';x.fillStyle='#ffd84d';x.fillText('PERFECT x'+combo,W/2,85)}}
 else{x.font='bold 42px system-ui';x.fillText(st==='start'?'PULSE HOP':'GAME OVER',W/2,H/2-110);x.font='18px system-ui';
  x.fillText(st==='start'?'One button: Space, click, or tap':'Score '+score+'   Best '+best,W/2,H/2-75);x.fillStyle='#5cf2ff';x.fillText('Press to '+(st==='start'?'start':'retry'),W/2,H/2+140)}
 requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);
</script></body></html>
